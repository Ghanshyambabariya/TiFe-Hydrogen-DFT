name: QE input preflight
on:
  push:
    paths:
      - 'src/qe_preflight.py'
      - 'src/structure_io.py'
      - 'qe_inputs/**'
      - 'tests/test_qe_preflight.py'
      - '.github/workflows/qe_preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_qe_preflight.py
      - run: python src/qe_preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: tife-qe-preflight
          path: results/preflight/qe_preflight.*
      - name: Record audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/preflight/qe_preflight.json results/preflight/qe_preflight.md
          git diff --cached --quiet || (git commit -m "Record QE input audit" && git push)
